<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sentinel | Security Operations</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0e13;--panel:#111820;--line:#24303a;--muted:#84919d;--text:#e7edf2;--cyan:#62d8d0;--red:#ff746d;--amber:#f3bd64}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -20%,#15383c 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:30px 32px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.title{font-size:32px;letter-spacing:-.04em;margin:6px 0}.sub{color:var(--muted);margin:0}.live{border:1px solid #28545b;border-radius:99px;padding:7px 13px;color:var(--cyan);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;margin-right:7px;box-shadow:0 0 12px var(--cyan)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.card,.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px}.card{padding:17px}.label{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line)}h2{font-size:15px;margin:0}.panelhead span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #1c252d;font-size:12px;vertical-align:top}th{color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:10px}td{color:#cbd5dc}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px}.pill{display:inline-block;border-radius:5px;padding:3px 7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.high,.critical{color:#ff9a93;background:#4a2225}.medium{color:#f3c879;background:#46351d}.low{color:#8adbd4;background:#183b3c}.toolbar{display:flex;gap:8px}input,button{background:#0b1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--cyan)}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:900px){main{padding:20px 14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{gap:15px}.live{white-space:nowrap}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.title{font-size:25px}th:nth-child(3),td:nth-child(3){display:none}}
  </style>
</head>
<body><main>
  <header class="top"><div><div class="eyebrow">Sentinel / security operations</div><div class="title">Endpoint signal, made legible.</div><p class="sub">Windows telemetry and detections from your connected agents.</p></div><div class="live"><i class="dot"></i>collector online</div></header>
  <section class="cards"><div class="card"><div class="label">Events collected</div><div class="value" id="events">—</div></div><div class="card"><div class="label">Open alerts</div><div class="value" id="openAlerts">—</div></div><div class="card"><div class="label">Critical alerts</div><div class="value" id="critical">—</div></div><div class="card"><div class="label">Active hosts</div><div class="value" id="hosts">—</div></div></section>
  <section class="grid"><div class="panel"><div class="panelhead"><h2>Recent alerts</h2><span id="alertCount">—</span></div><div id="alerts"></div></div><div class="panel"><div class="panelhead"><h2>Event stream</h2><div class="toolbar"><input id="search" placeholder="Search events" onkeydown="if(event.key==='Enter')loadEvents()"><button onclick="loadEvents()">Search</button></div></div><div id="eventsTable"></div></div></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url,opts){const r=await fetch(url,opts);return r.json()}
async function loadStats(){const x=await get('/api/stats');events.textContent=x.events.toLocaleString();openAlerts.textContent=x.openAlerts;critical.textContent=x.criticalAlerts;hosts.textContent=x.hosts}
async function loadAlerts(){const x=await get('/api/alerts');alertCount.textContent=x.total+' total';alerts.innerHTML=x.alerts.length?'<table><thead><tr><th>Severity</th><th>Detection</th><th>Host</th><th>Time</th></tr></thead><tbody>'+x.alerts.slice(0,12).map(a=>`<tr><td><span class="pill ${a.severity}">${esc(a.severity)}</span></td><td><b>${esc(a.title)}</b><br><span class="label">${esc(a.description)}</span></td><td class="mono">${esc(a.hostname)}</td><td class="mono">${esc(new Date(a.timestamp).toLocaleString())}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">No detections yet.</div>'}
async function loadEvents(){const q=encodeURIComponent(document.getElementById('search').value);const x=await get('/api/events?limit=18&search='+q);eventsTable.innerHTML=x.events.length?'<table><thead><tr><th>Time</th><th>Host</th><th>Category</th><th>Event</th></tr></thead><tbody>'+x.events.map(e=>`<tr><td class="mono">${esc(new Date(e.event.timeCreated||e.receivedAt).toLocaleTimeString())}</td><td class="mono">${esc(e.hostname)}</td><td>${esc(e.category)}</td><td><b>${esc(e.action)}</b><br><span class="label">${esc((e.event.message||'').slice(0,100))}</span></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No matching events.</div>'}
async function refresh(){await Promise.all([loadStats(),loadAlerts(),loadEvents()])}refresh();setInterval(refresh,15000);
</script></body></html>
