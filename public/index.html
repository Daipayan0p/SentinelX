<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel | Security Operations</title>
<style>
:root{color-scheme:dark;--bg:#0a0e13;--panel:#111820;--panel2:#0d141b;--line:#26343f;--muted:#84919d;--text:#e7edf2;--cyan:#62d8d0;--red:#ff746d;--amber:#f3bd64;--blue:#78a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -20%,#15383c 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit;background:#0b1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px}button{cursor:pointer}button:hover,a:hover{border-color:var(--cyan);color:var(--cyan)}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:25px 15px;background:#0b1117}.brand{font-size:18px;font-weight:750;letter-spacing:-.04em;padding:0 10px 25px}.brand small{display:block;color:var(--cyan);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}.nav-title{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:15px 10px 6px}.nav a{display:block;padding:9px 10px;border:1px solid transparent;border-radius:6px;color:#aebcc5}.nav a.active{background:#163335;color:var(--cyan);border-color:#28545b}.main{max-width:1500px;width:100%;padding:30px 34px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.title{font-size:31px;letter-spacing:-.04em;margin:6px 0}.sub{color:var(--muted);margin:0}.live{border:1px solid #28545b;border-radius:99px;padding:7px 13px;color:var(--cyan);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;margin-right:7px;box-shadow:0 0 12px var(--cyan)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.card,.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px}.card{padding:17px;cursor:pointer}.card:hover{border-color:var(--cyan);transform:translateY(-1px)}.label{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.panel{overflow:hidden;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0}h2{font-size:15px}h3{font-size:14px;margin:20px 0 9px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{min-width:200px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #1c252d;font-size:12px;vertical-align:top}th{color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:10px}td{color:#cbd5dc}.row{cursor:pointer}.row:hover td{background:#151f27}.mono{font:11px ui-monospace,SFMono-Regular,monospace}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:5px;padding:3px 7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.high,.critical{color:#ff9a93;background:#4a2225}.medium{color:#f3c879;background:#46351d}.low{color:#8adbd4;background:#183b3c}.online{color:var(--cyan)}.stale{color:var(--amber)}.offline{color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted)}.error{padding:18px;color:var(--red);border:1px solid #5c292d;border-radius:7px;background:#211417}.detail{padding:21px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.detail-item{border:1px solid var(--line);border-radius:7px;padding:10px;background:var(--panel2)}.detail-item b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:3px}.message{white-space:pre-wrap;background:#0b1117;border:1px solid var(--line);border-radius:7px;padding:14px;max-height:350px;overflow:auto}.timeline{border-left:2px solid #28545b;margin:15px 0;padding-left:18px}.timeline-item{margin:0 0 17px;position:relative}.timeline-item:before{content:"";position:absolute;left:-25px;top:5px;width:8px;height:8px;background:var(--cyan);border-radius:50%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}.notice{position:fixed;right:20px;bottom:20px;padding:12px 15px;background:#173d3b;border:1px solid var(--cyan);border-radius:7px;color:var(--cyan);z-index:4}.note{border-bottom:1px solid var(--line);padding:10px 0}.ai{white-space:pre-wrap;border-left:2px solid var(--cyan);padding:10px 14px;background:#0d1b1c}.breadcrumbs{color:var(--muted);font-size:12px;margin-bottom:15px}.back{color:var(--cyan)}pre{white-space:pre-wrap;overflow:auto}.nowrap{white-space:nowrap}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{display:inline-block;padding:5px 10px}.nav-title{display:none}.nav{display:flex;gap:5px;overflow:auto}.nav a{white-space:nowrap}.main{padding:20px 14px}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.title{font-size:25px}.top{gap:12px}.live{white-space:nowrap}.detail-grid{grid-template-columns:1fr 1fr}.panelhead{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar input{flex:1;min-width:100px}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body><div id="app"></div><script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=async(url,opts)=>{const r=await fetch(url,opts),text=await r.text();let x;try{x=JSON.parse(text)}catch{x={error:`Server returned ${r.status} ${r.statusText}`}}if(!r.ok)throw new Error(x.error||`Request failed (${r.status})`);return x};
const fmt=x=>x?new Date(x).toLocaleString(): 'Unavailable';
const path=()=>window.location.pathname;
function notify(text){const n=document.createElement('div');n.className='notice';n.textContent=text;document.body.appendChild(n);setTimeout(()=>n.remove(),3000)}
function navigate(url){history.pushState({},'',url);render()}
function navLink(url,label){return `<a href="${url}" class="${path()===url?'active':''}" onclick="event.preventDefault();navigate('${url}')">${label}</a>`}
function shell(content,title='Security operations',sub='Windows telemetry, detections, and investigation evidence.'){
app.innerHTML=`<div class="layout"><aside class="side"><div class="brand">SENTINEL<small>security operations</small></div><div class="nav-title">Workspace</div><nav class="nav">${navLink('/dashboard','Overview')}${navLink('/alerts','Alerts')}${navLink('/events','Events')}${navLink('/incidents','Incidents')}${navLink('/endpoints','Endpoints')}</nav><div class="nav-title">Governance</div><nav class="nav">${navLink('/audit-logs','Audit logs')}</nav></aside><main class="main"><header class="top"><div><div class="eyebrow">Sentinel / ${esc(title)}</div><div class="title">${esc(title)}</div><p class="sub">${esc(sub)}</p></div><div class="live"><i class="dot"></i>collector online</div></header>${content}</main></div>`}
function loading(){return ''}
function failure(error){return `<div class="error">${esc(error.message||error)}</div>`}
async function render(){const p=path();if(p==='/alerts'||p==='/alerts/')return alertsPage();if(p.startsWith('/alerts/'))return alertDetail(p.split('/')[2]);if(p==='/events'||p==='/events/')return eventsPage();if(p.startsWith('/events/'))return eventDetail(p.split('/')[2]);if(p==='/incidents'||p==='/incidents/')return incidentsPage();if(p.startsWith('/incidents/'))return incidentDetail(p.split('/')[2]);if(p==='/endpoints'||p==='/endpoints/')return endpointsPage();if(p.startsWith('/endpoints/'))return endpointDetail(decodeURIComponent(p.split('/')[2]));if(p==='/audit-logs')return auditPage();return dashboardPage()}
async function dashboardPage(){shell(loading(),'Dashboard');try{const [s,a,i,e,h]=await Promise.all([json('/api/stats'),json('/api/alerts?status=open&pageSize=8'),json('/api/incidents?status=open'),json('/api/events?pageSize=8'),json('/api/endpoints')]);document.querySelector('.main').innerHTML+=`<section class="cards"><div class="card" onclick="navigate('/events')"><div class="label">Events collected</div><div class="value">${s.events||0}</div></div><div class="card" onclick="navigate('/alerts?status=open')"><div class="label">Open alerts</div><div class="value">${s.openAlerts||0}</div></div><div class="card" onclick="navigate('/incidents?status=open')"><div class="label">Open incidents</div><div class="value">${s.incidents||0}</div></div><div class="card" onclick="navigate('/alerts?severity=critical')"><div class="label">Critical alerts</div><div class="value">${s.criticalAlerts||0}</div></div><div class="card" onclick="navigate('/endpoints')"><div class="label">Hosts observed</div><div class="value">${s.hosts||0}</div></div></section><div class="grid"><section class="panel"><div class="panelhead"><h2>Recent alerts</h2><a class="back" href="/alerts" onclick="event.preventDefault();navigate('/alerts')">View all</a></div>${alertTable(a.alerts)}</section><section class="panel"><div class="panelhead"><h2>Correlated incidents</h2><a class="back" href="/incidents" onclick="event.preventDefault();navigate('/incidents')">View all</a></div>${incidentTable(i.incidents)}</section></div><section class="panel"><div class="panelhead"><h2>Security event stream</h2><a class="back" href="/events" onclick="event.preventDefault();navigate('/events')">Open explorer</a></div>${eventTable(e.events)}</section><section class="panel"><div class="panelhead"><h2>Endpoint health</h2><a class="back" href="/endpoints" onclick="event.preventDefault();navigate('/endpoints')">Inventory</a></div>${endpointTable(h.endpoints)}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
function alertTable(items){if(!items?.length)return '<div class="empty">No open alerts.</div>';return `<table><thead><tr><th>Severity</th><th>Detection</th><th>Host</th><th>Status</th><th>Time</th></tr></thead><tbody>${items.map(a=>`<tr class="row" onclick="navigate('/alerts/${a.id}')"><td><span class="pill ${esc(a.severity)}">${esc(a.severity)}</span></td><td><b>${esc(a.title)}</b><br><span class="muted">${esc(a.description)}</span></td><td class="mono">${esc(a.hostname)}</td><td>${esc(a.status)}</td><td class="mono nowrap">${esc(fmt(a.timestamp))}</td></tr>`).join('')}</tbody></table>`}
function incidentTable(items){if(!items?.length)return '<div class="empty">No active incidents.</div>';return `<table><thead><tr><th>Severity</th><th>Incident</th><th>Host</th><th>Signals</th></tr></thead><tbody>${items.map(i=>`<tr class="row" onclick="navigate('/incidents/${i.id}')"><td><span class="pill ${esc(i.severity)}">${esc(i.severity)}</span></td><td>${esc(i.title)}</td><td class="mono">${esc(i.hostname)}</td><td>${i.alertCount}</td></tr>`).join('')}</tbody></table>`}
function eventTable(items){if(!items?.length)return '<div class="empty">No security events found.</div>';return `<table><thead><tr><th>Time</th><th>Host</th><th>Category</th><th>Action</th><th>Message</th></tr></thead><tbody>${items.map(e=>`<tr class="row" onclick="navigate('/events/${e.id}')"><td class="mono nowrap">${esc(fmt(e.event.timeCreated||e.receivedAt))}</td><td class="mono">${esc(e.hostname)}</td><td>${esc(e.category)}</td><td>${esc(e.action)}<br><span class="muted">Event ${esc(e.event.eventId)}</span></td><td>${esc((e.event.message||'').slice(0,140))}</td></tr>`).join('')}</tbody></table>`}
function endpointTable(items){if(!items?.length)return '<div class="empty">No endpoints observed.</div>';return `<table><thead><tr><th>Hostname</th><th>Status</th><th>Last check-in</th><th>Events</th><th>Alerts</th></tr></thead><tbody>${items.map(h=>`<tr class="row" onclick="navigate('/endpoints/${encodeURIComponent(h.hostname)}')"><td class="mono">${esc(h.hostname)}</td><td class="${esc(h.status)}">${esc(h.status)}</td><td class="mono">${esc(fmt(h.lastSeen))}</td><td>${h.eventCount}</td><td>${h.alertCount}</td></tr>`).join('')}</tbody></table>`}
function pager(page,totalPages,fn){if(totalPages<=1)return '';return `<div class="pagination"><button ${page<=1?'disabled':''} onclick="${fn}(${page-1})">Previous</button><span class="muted">Page ${page} of ${totalPages}</span><button ${page>=totalPages?'disabled':''} onclick="${fn}(${page+1})">Next</button></div>`}
async function alertsPage(){shell(loading(),'Alerts','Search and manage detections with persisted analyst actions.');try{const q=new URLSearchParams(location.search),status=q.get('status')||'',severity=q.get('severity')||'',page=Number(q.get('page')||1),x=await json(`/api/alerts?status=${encodeURIComponent(status)}&severity=${encodeURIComponent(severity)}&page=${page}&pageSize=25`);document.querySelector('.main').innerHTML+=`<section class="panel"><div class="panelhead"><h2>Alert queue <span class="muted">${x.total} total</span></h2><div class="toolbar"><select id="alertStatus"><option value="">All status</option><option ${status==='open'?'selected':''}>open</option><option ${status==='investigating'?'selected':''}>investigating</option><option ${status==='acknowledged'?'selected':''}>acknowledged</option><option ${status==='resolved'?'selected':''}>resolved</option><option ${status==='false_positive'?'selected':''}>false_positive</option></select><select id="alertSeverity"><option value="">All severity</option><option ${severity==='critical'?'selected':''}>critical</option><option ${severity==='high'?'selected':''}>high</option><option ${severity==='medium'?'selected':''}>medium</option><option ${severity==='low'?'selected':''}>low</option></select><button onclick="navigate('/alerts?status='+encodeURIComponent(alertStatus.value)+'&severity='+encodeURIComponent(alertSeverity.value))">Filter</button></div></div>${alertTable(x.alerts)}${pager(x.page,x.totalPages,'alertPage')}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
function alertPage(p){const q=new URLSearchParams(location.search);q.set('page',p);navigate('/alerts?'+q)}
async function alertDetail(id){shell(loading(),'Alert investigation');try{const x=await json('/api/alerts/'+encodeURIComponent(id)),a=x.alert;document.querySelector('.main').innerHTML+=`<div class="breadcrumbs"><a class="back" href="/alerts" onclick="event.preventDefault();navigate('/alerts')">Alerts</a> / ${esc(a.id)}</div><section class="panel detail"><div class="panelhead"><h2>${esc(a.title)}</h2><span class="pill ${esc(a.severity)}">${esc(a.severity)}</span></div><div class="detail-grid"><div class="detail-item"><b>Alert ID</b><span class="mono">${esc(a.id)}</span></div><div class="detail-item"><b>Status</b>${esc(a.status)}</div><div class="detail-item"><b>Host</b><a class="back" href="/endpoints/${encodeURIComponent(a.hostname)}" onclick="event.preventDefault();navigate('/endpoints/${encodeURIComponent(a.hostname)}')">${esc(a.hostname)}</a></div><div class="detail-item"><b>Rule</b>${esc(a.ruleId)}</div><div class="detail-item"><b>MITRE</b>${esc(a.technique||'Unavailable')}</div><div class="detail-item"><b>First seen</b>${esc(fmt(a.timestamp))}</div><div class="detail-item"><b>Assigned analyst</b>${esc(a.assignedTo||'Unassigned')}</div><div class="detail-item"><b>Resolution</b>${esc(a.resolutionReason||'Not resolved')}</div></div><p>${esc(a.description)}</p><div class="actions"><button onclick="alertAction('${esc(a.id)}','acknowledge')">Acknowledge</button><button onclick="alertAction('${esc(a.id)}','investigate')">Investigate</button><button onclick="assignAlert('${esc(a.id)}')">Assign</button><button onclick="resolveAlert('${esc(a.id)}','resolve')">Resolve</button><button onclick="resolveAlert('${esc(a.id)}','false_positive')">False positive</button></div><h3>Evidence event</h3>${x.event?eventTable([x.event]):'<div class="empty">Original event unavailable.</div>'}<h3>Related alerts and incident</h3>${x.incident?`<p><a class="back" href="/incidents/${x.incident.id}" onclick="event.preventDefault();navigate('/incidents/${x.incident.id}')">${esc(x.incident.title)}</a></p>`: '<p class="muted">No correlated incident.</p>'}${alertTable(x.relatedAlerts)}<h3>History</h3>${historyTable(x.history)}<h3>Investigation notes</h3>${notesTable(x.notes)}<div class="toolbar"><textarea id="noteText" placeholder="Add an investigation note" rows="2"></textarea><button onclick="addNote('${esc(a.id)}')">Save note</button></div></section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
function historyTable(items){if(!items?.length)return '<div class="empty">No status history.</div>';return '<div class="timeline">'+items.map(h=>`<div class="timeline-item"><b>${esc(h.action)}</b> <span class="muted">by ${esc(h.actor)} at ${esc(fmt(h.createdAt))}</span>${h.reason?`<div>${esc(h.reason)}</div>`:''}</div>`).join('')+'</div>'}
function notesTable(items){if(!items?.length)return '<div class="empty">No analyst notes.</div>';return items.map(n=>`<div class="note"><b>${esc(n.actor)}</b> <span class="muted">${esc(fmt(n.createdAt))}</span><br>${esc(n.content)}</div>`).join('')}
async function alertAction(id,action){try{await json('/api/alerts/'+id+'/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,actor:'analyst'})});notify('Alert updated');alertDetail(id)}catch(e){notify(e.message)}}
async function assignAlert(id){const assignedTo=prompt('Assign to analyst:');if(!assignedTo)return;try{await json('/api/alerts/'+id+'/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'assign',assignedTo,actor:'analyst'})});notify('Alert assigned');alertDetail(id)}catch(e){notify(e.message)}}
async function resolveAlert(id,action){const reason=prompt(action==='false_positive'?'Why is this a false positive?':'Resolution reason:');if(!reason)return;try{await json('/api/alerts/'+id+'/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,reason,actor:'analyst'})});notify('Alert action saved');alertDetail(id)}catch(e){notify(e.message)}}
async function addNote(id){const content=document.getElementById('noteText').value;if(!content.trim())return;try{await json('/api/alerts/'+id+'/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content,actor:'analyst'})});notify('Note saved');alertDetail(id)}catch(e){notify(e.message)}}
async function eventsPage(){shell(loading(),'Events','Search, filter, and inspect security-relevant endpoint activity.');try{const q=new URLSearchParams(location.search),search=q.get('search')||'',category=q.get('category')||'',hostname=q.get('hostname')||'',eventId=q.get('eventId')||'',page=Number(q.get('page')||1),x=await json(`/api/events?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}&hostname=${encodeURIComponent(hostname)}&eventId=${encodeURIComponent(eventId)}&page=${page}&pageSize=30`),cats=await json('/api/categories');document.querySelector('.main').innerHTML+=`<section class="panel"><div class="panelhead"><h2>Security event explorer <span class="muted">${x.total} results</span></h2><div class="toolbar"><input id="eventSearch" value="${esc(search)}" placeholder="Search events"><input id="eventHost" value="${esc(hostname)}" placeholder="Hostname"><select id="eventCategory"><option value="">All categories</option>${cats.categories.map(c=>`<option value="${esc(c.name)}" ${category===c.name?'selected':''}>${esc(c.name)} (${c.count})</option>`).join('')}</select><input id="eventId" value="${esc(eventId)}" placeholder="Event ID"><button onclick="eventFilter()">Apply</button></div></div>${eventTable(x.events)}${pager(x.page,x.totalPages,'eventPage')}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
function eventFilter(){navigate('/events?search='+encodeURIComponent(eventSearch.value)+'&hostname='+encodeURIComponent(eventHost.value)+'&category='+encodeURIComponent(eventCategory.value)+'&eventId='+encodeURIComponent(eventId.value))}function eventPage(p){const q=new URLSearchParams(location.search);q.set('page',p);navigate('/events?'+q)}
async function eventDetail(id){shell(loading(),'Event investigation');try{const x=await json('/api/events/'+encodeURIComponent(id)),e=x.event;document.querySelector('.main').innerHTML+=`<div class="breadcrumbs"><a class="back" href="/events" onclick="event.preventDefault();navigate('/events')">Events</a> / ${esc(e.id)}</div><section class="panel detail"><div class="panelhead"><h2>Event ${esc(e.event.eventId)}</h2><span class="pill ${e.securityRelevant?'high':'low'}">${e.securityRelevant?'security relevant':'general'}</span></div><div class="detail-grid"><div class="detail-item"><b>Event ID</b>${esc(e.event.eventId)}</div><div class="detail-item"><b>Category</b>${esc(e.category)}</div><div class="detail-item"><b>Timestamp</b>${esc(fmt(e.event.timeCreated||e.receivedAt))}</div><div class="detail-item"><b>Host</b>${esc(e.hostname)}</div><div class="detail-item"><b>Provider</b>${esc(e.event.provider||'Unavailable')}</div><div class="detail-item"><b>User</b>${esc(e.user||'Unavailable')}</div><div class="detail-item"><b>Process</b>${esc(e.processName||'Unavailable')}</div><div class="detail-item"><b>Reason</b>${esc(e.relevanceReason)}</div></div><h3>Message</h3><div class="message">${esc(e.event.message||'Unavailable')}</div><h3>Structured event fields</h3><pre class="message">${esc(JSON.stringify(e.event.eventData||{},null,2))}</pre><h3>Original payload</h3><pre class="message">${esc(JSON.stringify(e.event,null,2))}</pre><h3>Related alerts</h3>${alertTable(x.relatedAlerts)}<h3>Related events</h3>${eventTable(x.relatedEvents.slice(0,30))}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
async function incidentsPage(){shell(loading(),'Incidents','Correlated investigations built from explainable host and time relationships.');try{const x=await json('/api/incidents');document.querySelector('.main').innerHTML+=`<section class="panel"><div class="panelhead"><h2>Incident queue <span class="muted">${x.total} total</span></h2></div>${incidentTable(x.incidents)}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
async function incidentDetail(id){shell(loading(),'Incident investigation');try{const x=await json('/api/incidents/'+encodeURIComponent(id)),i=x.incident;document.querySelector('.main').innerHTML+=`<div class="breadcrumbs"><a class="back" href="/incidents" onclick="event.preventDefault();navigate('/incidents')">Incidents</a> / ${esc(i.id)}</div><section class="panel detail"><div class="panelhead"><h2>${esc(i.title)}</h2><span class="pill ${esc(i.severity)}">${esc(i.severity)}</span></div><div class="detail-grid"><div class="detail-item"><b>Incident ID</b><span class="mono">${esc(i.id)}</span></div><div class="detail-item"><b>Status</b>${esc(i.status)}</div><div class="detail-item"><b>Host</b>${esc(i.hostname)}</div><div class="detail-item"><b>Alerts</b>${i.alertCount}</div><div class="detail-item"><b>First seen</b>${esc(fmt(i.firstSeen))}</div><div class="detail-item"><b>Last activity</b>${esc(fmt(i.lastSeen))}</div></div><h3>Why these alerts are grouped</h3><div class="timeline">${x.associationReasons.map(r=>`<div class="timeline-item"><b>${esc(r.alertId)}</b><br>${esc(r.reason)}</div>`).join('')}</div><h3>Associated alerts</h3>${alertTable(x.alerts)}<h3>Incident timeline</h3>${eventTable(x.evidence)}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
async function endpointsPage(){shell(loading(),'Endpoints','Endpoint inventory and collection health from observed telemetry.');try{const x=await json('/api/endpoints');document.querySelector('.main').innerHTML+=`<section class="panel"><div class="panelhead"><h2>Endpoint inventory <span class="muted">${x.total} hosts</span></h2></div>${endpointTable(x.endpoints)}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
async function endpointDetail(host){shell(loading(),'Endpoint details');try{const x=await json('/api/endpoints/'+encodeURIComponent(host));document.querySelector('.main').innerHTML+=`<div class="breadcrumbs"><a class="back" href="/endpoints" onclick="event.preventDefault();navigate('/endpoints')">Endpoints</a> / ${esc(x.hostname)}</div><section class="panel detail"><div class="panelhead"><h2>${esc(x.hostname)}</h2><span class="${esc(x.status)}">${esc(x.status)}</span></div><div class="detail-grid"><div class="detail-item"><b>Operating system</b>${esc(x.operatingSystem)}</div><div class="detail-item"><b>Agent ID</b><span class="mono">${esc(x.agentId)}</span></div><div class="detail-item"><b>Events</b>${x.eventCount}</div><div class="detail-item"><b>Last event</b>${esc(fmt(x.lastSeen))}</div></div><h3>Associated alerts</h3>${alertTable(x.alerts)}<h3>Security timeline</h3>${eventTable(x.events)}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
async function auditPage(){shell(loading(),'Audit logs','Persisted analyst actions and investigation history.');try{const x=await json('/api/audit-logs');document.querySelector('.main').innerHTML+=`<section class="panel"><div class="panelhead"><h2>Audit history <span class="muted">${x.total} actions</span></h2></div>${x.auditLogs.length?`<table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody>${x.auditLogs.map(a=>`<tr><td class="mono">${esc(fmt(a.createdAt))}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.targetType)} / ${esc(a.targetId)}</td><td>${esc(a.result)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No analyst actions recorded yet.</div>'}</section>`}catch(e){document.querySelector('.main').innerHTML+=failure(e)}}
const baseAlertDetail=alertDetail;alertDetail=async id=>{await baseAlertDetail(id);try{const x=await json('/api/alerts/'+encodeURIComponent(id)+'/timeline'),panel=document.querySelector('.detail');if(panel)panel.insertAdjacentHTML('beforeend',`<h3>Correlated activity timeline</h3><p class="muted">${esc(x.explanation)}</p><div class="timeline">${x.steps.length?x.steps.map(step=>`<div class="timeline-item"><b>${esc(step.event.action)}</b> <span class="pill ${step.confidence==='high'?'high':step.confidence==='medium'?'medium':'low'}">${esc(step.confidence)}</span><br><span class="mono">${esc(fmt(step.event.event.timeCreated||step.event.receivedAt))}</span> · ${esc(step.relation)} · ${step.occurrences} occurrence(s)<br>${esc((step.event.event.message||'').slice(0,300))}</div>`).join(''):'<div class="empty">No correlated activity found.</div>'}</div>`)}catch(error){notify(error.message)}};window.addEventListener('popstate',render);
async function settingsPage(){shell('', 'Data management', 'Delete collected event JSONL data while preserving alert and audit history.');document.querySelector('.main').innerHTML+=`<section class="panel detail"><div class="panelhead"><h2>Event log retention</h2><span class="pill high">destructive</span></div><p>These actions permanently remove event JSONL records. Alert history, analyst notes, and audit logs are preserved, but deleted evidence will no longer be available to investigations.</p><h3>Delete by timestamp</h3><div class="toolbar"><label>From <input id="deleteFrom" type="datetime-local"></label><label>To <input id="deleteTo" type="datetime-local"></label><button onclick="deleteEventLogs('range')">Delete range</button></div><h3>Delete everything</h3><p class="muted">Use this only when you intentionally want to clear all collected event logs.</p><button class="high" onclick="deleteEventLogs('all')">Delete all event logs</button></section>`}
async function deleteEventLogs(scope){const confirmation=prompt(scope==='all'?'This permanently deletes every event JSONL file. Type DELETE to continue.':'This permanently deletes events in the selected range. Type DELETE to continue.');if(confirmation!=='DELETE'){notify('Deletion cancelled');return}const body={scope,confirm:confirmation,actor:'analyst'};if(scope==='range'){const from=document.getElementById('deleteFrom').value,to=document.getElementById('deleteTo').value;if(!from||!to){notify('Select both timestamps');return}body.from=new Date(from).toISOString();body.to=new Date(to).toISOString()}try{const x=await json('/api/events',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify(body)});notify(`${x.removed} event records deleted`);navigate('/dashboard')}catch(error){notify(error.message)}}
const baseShell2=shell;shell=(...args)=>{baseShell2(...args);const nav=document.querySelector('.nav');if(nav&&!nav.querySelector('[href="/settings"]'))nav.insertAdjacentHTML('beforeend',`<a href="/settings" onclick="event.preventDefault();navigate('/settings')" class="${path()==='/settings'?'active':''}">Data management</a>`)};const baseRender2=render;render=async()=>{if(path()==='/settings')return settingsPage();return baseRender2()};
settingsPage=async()=>{shell('', 'Data management', 'Delete collected event and alert data for a clean test environment.');document.querySelector('.main').innerHTML+=`<section class="panel detail"><div class="panelhead"><h2>Event log retention</h2><span class="pill high">destructive</span></div><p>Event deletion permanently removes event JSONL records. Alert and audit state is preserved unless you explicitly delete alerts below.</p><h3>Delete events by timestamp</h3><div class="toolbar"><label>From <input id="deleteFrom" type="datetime-local"></label><label>To <input id="deleteTo" type="datetime-local"></label><button onclick="deleteEventLogs('range')">Delete event range</button></div><button class="high" onclick="deleteEventLogs('all')">Delete all event logs</button><h3>Delete alerts by timestamp</h3><div class="toolbar"><label>From <input id="deleteAlertFrom" type="datetime-local"></label><label>To <input id="deleteAlertTo" type="datetime-local"></label><button onclick="deleteAlertData('range')">Delete alert range</button></div><button class="high" onclick="deleteAlertData('all')">Delete all alerts</button></section>`};async function deleteAlertData(scope){const confirmation=prompt(scope==='all'?'This permanently deletes every alert, alert history, and alert note. Type DELETE to continue.':'This permanently deletes alerts in the selected range and their history/notes. Type DELETE to continue.');if(confirmation!=='DELETE'){notify('Deletion cancelled');return}const body={scope,confirm:confirmation,actor:'analyst'};if(scope==='range'){const from=document.getElementById('deleteAlertFrom').value,to=document.getElementById('deleteAlertTo').value;if(!from||!to){notify('Select both alert timestamps');return}body.from=new Date(from).toISOString();body.to=new Date(to).toISOString()}try{const x=await json('/api/alerts',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify(body)});notify(`${x.removed} alerts deleted`);navigate('/dashboard')}catch(error){notify(error.message)}};render();
const rememberFilterState=()=>{try{if(path()==='/alerts'||path()==='/events')sessionStorage.setItem(`sentinel:${path()}:filters`,location.search)}catch(_){}};const navigateBase=navigate;navigate=url=>{rememberFilterState();let target=url;try{const targetPath=new URL(url,location.origin).pathname;if((targetPath==='/alerts'||targetPath==='/events')&&!new URL(url,location.origin).search){const saved=sessionStorage.getItem(`sentinel:${targetPath}:filters`);if(saved)target=targetPath+saved}}catch(_){}navigateBase(target)};setTimeout(()=>{try{if((path()==='/alerts'||path()==='/events')&&!location.search){const saved=sessionStorage.getItem(`sentinel:${path()}:filters`);if(saved)navigateBase(path()+saved)}else rememberFilterState()}catch(_){}},0);
</script></body></html>
